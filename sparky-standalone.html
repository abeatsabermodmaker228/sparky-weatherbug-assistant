<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#667eea" />
  <title>Sparky Weather Assistant</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #dfeaff 35%, #f3f7ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #1d2433;
    }

    .app {
      width: min(100%, 640px);
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(129, 154, 255, 0.2);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(44, 62, 120, 0.18);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #768af7 0%, #5d6fe5 35%, #485cc4 100%);
      color: white;
      padding: 28px 24px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: 0.03em;
    }

    .header p {
      margin: 10px 0 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .content {
      padding: 24px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #c8d2ff;
      font-size: 1rem;
      background: rgba(245,247,255,0.9);
      color: #1d2433;
    }

    input[type="text"]:focus {
      outline: 2px solid rgba(93,111,229,0.28);
      border-color: #7187f8;
    }

    button {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #738af7 0%, #5b6ee5 100%);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 10px 24px rgba(93,110,229,0.2);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .mic {
      width: 52px;
      height: 52px;
      min-width: 52px;
      font-size: 1.3rem;
      padding: 0;
    }

    .mic.listening {
      animation: pulse 0.7s infinite ease-in-out;
      background: linear-gradient(135deg, #ff6b6b 0%, #ef3b3b 100%);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .location-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .location-btn {
      flex: 1 1 120px;
      padding: 10px 12px;
      background: #eef3ff;
      color: #4054d4;
      border: 1px solid #c8d2ff;
      box-shadow: none;
      font-size: 0.9rem;
    }

    .location-btn:hover {
      background: #e2eaff;
    }

    .upload-box {
      border: 2px dashed #c7d3ff;
      border-radius: 16px;
      background: #f7f9ff;
      padding: 16px;
      margin-bottom: 18px;
    }

    .upload-box label {
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #4253ca;
      font-weight: 600;
    }

    .upload-box input[type="file"] {
      padding: 8px;
      background: white;
      border: 1px solid #dbe3ff;
      border-radius: 10px;
    }

    .card {
      display: none;
      background: linear-gradient(180deg, #f9fbff 0%, #f0f5ff 100%);
      border: 1px solid #dfe8ff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .alert-badge {
      font-size: clamp(2.6rem, 7vw, 4rem);
      text-align: center;
      margin-bottom: 12px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .sprite-wrap {
      width: 220px;
      height: 220px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%);
      border: 1px solid #dfe8ff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(113, 135, 248, 0.1);
    }

    .sprite-wrap img, .sprite-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }

    .weather-text {
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      background: rgba(255,255,255,0.7);
      border: 1px solid #dae4ff;
      border-radius: 12px;
      padding: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      font-size: 0.92rem;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px 0 10px;
      color: #4659d8;
      font-weight: 700;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 12px;
      border: 4px solid #e6edff;
      border-top: 4px solid #7187f8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 560px) {
      .content { padding: 18px; }
      .controls { flex-direction: column; }
      .mic { width: 100%; }
      .location-btn { flex: 1 1 45%; }
      .sprite-wrap { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>🐞 Sparky</h1>
      <p>Weather Assistant</p>
    </div>

    <div class="content">
      <div class="controls">
        <input id="query" type="text" placeholder="Ask: 'What's the weather in Menifee?'" />
        <button id="micBtn" class="mic" aria-label="Voice input">🎤</button>
      </div>

      <div class="location-row">
        <button class="location-btn" data-location="Menifee">Menifee</button>
        <button class="location-btn" data-location="Los Angeles">Los Angeles</button>
        <button class="location-btn" data-location="New York">New York</button>
        <button class="location-btn" data-location="London">London</button>
      </div>

      <div class="upload-box">
        <label>
          Upload your own Sparky GIF sprite
          <input id="spriteUpload" type="file" accept="image/gif,image/png,image/webp,image/jpeg" />
        </label>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Sparky is checking the weather...</div>
      </div>

      <div id="card" class="card">
        <div id="alertBadge" class="alert-badge">🟢</div>

        <div class="sprite-wrap">
          <img id="spritePreview" alt="Sparky sprite" src="" />
        </div>

        <div id="weatherText" class="weather-text"></div>
      </div>
    </div>
  </div>

  <script>
    const WEATHER_DATABASE = {
      menifee: {
        city: 'Menifee',
        country: 'USA',
        temp: 79,
        feels_like: 82,
        humidity: 38,
        wind: 7,
        description: 'Sunny and warm',
        alert: 'SAFE'
      },
      'los angeles': {
        city: 'Los Angeles',
        country: 'USA',
        temp: 76,
        feels_like: 78,
        humidity: 45,
        wind: 9,
        description: 'Clear skies',
        alert: 'SAFE'
      },
      'new york': {
        city: 'New York',
        country: 'USA',
        temp: 71,
        feels_like: 70,
        humidity: 60,
        wind: 11,
        description: 'Cloudy with a mild breeze',
        alert: 'SAFE'
      },
      london: {
        city: 'London',
        country: 'UK',
        temp: 61,
        feels_like: 60,
        humidity: 72,
        wind: 14,
        description: 'Light rain',
        alert: 'WARNING'
      },
      dubai: {
        city: 'Dubai',
        country: 'UAE',
        temp: 98,
        feels_like: 104,
        humidity: 19,
        wind: 6,
        description: 'Very hot and dry',
        alert: 'DANGER'
      },
      paris: {
        city: 'Paris',
        country: 'France',
        temp: 64,
        feels_like: 62,
        humidity: 78,
        wind: 16,
        description: 'Rain showers',
        alert: 'WARNING'
      }
    };

    const DEFAULT_GIF = "data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAACH5BAAAAAAALAAAAAAQABAAACjpSpq7n0eV6k+Va8aGGzWwAAAAAElFTkSuQmCC";
    let currentSprite = DEFAULT_GIF;
    let lastLocation = 'Menifee';

    function setSpriteByWeather(alert) {
      const spriteMap = {
        SAFE: "data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAACH5BAAAAAAALAAAAAAQABAAACjpSpq7n0eV6k+Va8aGGzWwAAAAAElFTkSuQmCC",
        WARNING: "data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAACH5BAAAAAAALAAAAAAQABAAACjpSpq7n0eV6k+Va8aGGzWwAAAAAElFTkSuQmCC",
        DANGER: "data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAACH5BAAAAAAALAAAAAAQABAAACjpSpq7n0eV6k+Va8aGGzWwAAAAAElFTkSuQmCC"
      };
      const selected = spriteMap[alert] || DEFAULT_GIF;
      document.getElementById('spritePreview').src = currentSprite || selected;
    }

    function getWeather(location) {
      const key = String(location || lastLocation).trim().toLowerCase();
      if (WEATHER_DATABASE[key]) {
        lastLocation = key;
        return WEATHER_DATABASE[key];
      }

      const matches = Object.keys(WEATHER_DATABASE).find(k => k.includes(key) || key.includes(k));
      if (matches) {
        lastLocation = matches;
        return WEATHER_DATABASE[matches];
      }

      return WEATHER_DATABASE.menifee;
    }

    function processWeatherInput(rawInput) {
      const location = rawInput && rawInput.trim() ? rawInput.trim() : lastLocation;
      const weather = getWeather(location);
      const temp = weather.temp + Math.floor(Math.random() * 4) - 1;
      const feelsLike = weather.feels_like + Math.floor(Math.random() * 4) - 1;
      const humidity = Math.min(100, Math.max(0, weather.humidity + Math.floor(Math.random() * 12) - 5));
      const wind = Math.max(0, weather.wind + Math.floor(Math.random() * 6) - 2);
      const alertMap = {
        SAFE: '🟢',
        WARNING: '🟡',
        DANGER: '🔴'
      };

      const message = `
📍 ${weather.city}, ${weather.country}
🌤️ ${weather.description}
🌡️ Temperature: ${temp}°F
Feels like: ${feelsLike}°F
💧 Humidity: ${humidity}%
💨 Wind: ${wind} mph

${alertMap[weather.alert]} ${weather.alert === 'SAFE' ? 'All clear!' : weather.alert === 'WARNING' ? 'Weather warning nearby.' : 'Danger alert!'}
      `;

      return {
        alert: alertMap[weather.alert],
        text: message.trim(),
        location: weather.city
      };
    }

    function showWeather(data) {
      const card = document.getElementById('card');
      document.getElementById('alertBadge').textContent = data.alert;
      document.getElementById('weatherText').textContent = data.text;
      setSpriteByWeather(data.alert.replace('🟢','SAFE').replace('🟡','WARNING').replace('🔴','DANGER'));
      card.style.display = 'block';
    }

    function askWeather(query) {
      if (!query.trim()) return;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('card').style.display = 'none';

      setTimeout(() => {
        const result = processWeatherInput(query);
        document.getElementById('loading').style.display = 'none';
        showWeather(result);
      }, 600);
    }

    document.getElementById('query').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') askWeather(event.target.value);
    });

    document.querySelectorAll('.location-btn').forEach(button => {
      button.addEventListener('click', () => askWeather(button.dataset.location));
    });

    document.getElementById('micBtn').addEventListener('click', () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Speech recognition is not supported in this browser.');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      document.getElementById('micBtn').classList.add('listening');
      recognition.start();

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('query').value = transcript;
        askWeather(transcript);
      };

      recognition.onend = () => {
        document.getElementById('micBtn').classList.remove('listening');
      };
    });

    document.getElementById('spriteUpload').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      currentSprite = url;
      document.getElementById('spritePreview').src = url;
    });

    // Default load: Menifee
    askWeather('Menifee');
  </script>
</body>
</html>
